[project]
name = "app-conf-project-repair-requests"
# Версия приложения задаётся в main.py (FastAPI(version=...)); это поле приложением не используется
version = "0.1.0"
description = ""
authors = [
    {name = "Иван Петров",email = "ivan.petrov@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (==0.17.1)",
    "mypy (==2.4.0)"
]
