[project]
name = "app-conf-project-repair-requests"
# Версия приложения задаётся в main.py (FastAPI(version=...)); это поле приложением не используется
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.1",
]
